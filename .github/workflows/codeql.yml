name: CodeQL
'on':
  pull_request: null
  push:
    branches:
    - main
  schedule:
  - cron: 23 5 * * 3
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: github/codeql-action/init@977e6ceaea7361825998245d787fa3b4d6b9e5df
      with:
        languages: python
        build-mode: none
    - uses: github/codeql-action/analyze@977e6ceaea7361825998245d787fa3b4d6b9e5df

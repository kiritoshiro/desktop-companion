name: CodeQL
# Reusable: runs only through security-gate.yml, which owns the triggers,
# schedule and concurrency.
'on':
  workflow_call:
permissions:
  contents: read
jobs:
  analyze:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: github/codeql-action/init@977e6ceaea7361825998245d787fa3b4d6b9e5df
      with:
        # Rust is the app; Python is left only in small scripts (the security
        # helpers and the fixture generators under rust/crates/*/tools).
        languages: rust, python
        build-mode: none
    - uses: github/codeql-action/analyze@977e6ceaea7361825998245d787fa3b4d6b9e5df

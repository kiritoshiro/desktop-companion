name: Windows CI

# The Rust app in rust/. The job keeps the id validate-and-build, the check
# branch protection on main requires. Its tests read the shipped models,
# personalities, presets and assets, so it runs on every change.
on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main. Work is sequenced as a
  # stack of small branches, and a pull request from one package branch onto
  # another got no CI at all while this filtered on main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: rust
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # rust/rust-toolchain.toml picks the channel; rustup on the runner
      # installs it on first use.
      - name: Show toolchain
        run: |
          rustup component add clippy rustfmt
          rustc --version
          cargo --version

      # Saved from main, where pull requests can restore it; a cache saved on
      # a pull request is visible to that pull request only.
      - name: Cache Cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Headless: no window opens. Test runs write only to temporary folders.
      - name: Tests
        env:
          DESKTOP_BUG_STATE_DIR: ${{ runner.temp }}\dc-state
        run: cargo test --workspace --locked

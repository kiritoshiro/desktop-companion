name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Validate source and data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = Join-Path $PWD 'src'

          python -m compileall -q src tools launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-ChildItem models -Recurse -Filter model.json -File | ForEach-Object {
            python tools/validate_model.py $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          Get-ChildItem presets -Filter *.json -File | ForEach-Object {
            python tools/validate_preset.py $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build Windows executable smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name DesktopBugCompanion `
            --distpath ci-dist `
            --workpath ci-build `
            --paths src `
            --add-data 'models;models' `
            --add-data 'personalities;personalities' `
            --add-data 'presets;presets' `
            --hidden-import desktop_bug.engine `
            launcher.py

          if (-not (Test-Path -LiteralPath 'ci-dist/DesktopBugCompanion.exe')) {
            throw 'PyInstaller did not produce ci-dist/DesktopBugCompanion.exe'
          }

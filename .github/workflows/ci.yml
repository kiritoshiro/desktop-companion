name: Windows CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main. Work is sequenced as a
  # stack of small branches, and a pull request from one package branch onto
  # another got no CI at all while this filtered on main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the version developers use locally, so a failure here is
          # reproducible on a workstation.
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      # One runner, shared with the release workflow. It discovers the smoke
      # tests rather than being handed a list that can drift out of date, and a
      # forgotten list entry fails silently by simply not running anything.
      - name: Run all checks (compile, data, pytest, ruff)
        shell: pwsh
        run: python tools/run_all_checks.py

      - name: Build Windows executable smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m PyInstaller --noconfirm --clean `
            --distpath ci-dist --workpath ci-build `
            DesktopBugCompanion.spec

          if (-not (Test-Path -LiteralPath 'ci-dist/DesktopBugCompanion.exe')) {
            throw 'PyInstaller did not produce ci-dist/DesktopBugCompanion.exe'
          }

name: Rust CI

# The Rust port in rust/ (see rust/PORTING.md). Its tests read the shipped
# models, personalities, presets and assets, so changes there run it too.
on:
  push:
    branches: [main]
    paths: &rust-paths
      - 'rust/**'
      - 'models/**'
      - 'personalities/**'
      - 'presets/**'
      - 'assets/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths: *rust-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: cargo test and clippy
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: rust
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # rust/rust-toolchain.toml picks the channel; rustup on the runner
      # installs it on first use.
      - name: Show toolchain
        run: |
          rustup component add clippy rustfmt
          rustc --version
          cargo --version

      - name: Cache Cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Headless: no window opens. Test runs write only to temporary folders.
      - name: Tests
        env:
          DESKTOP_BUG_STATE_DIR: ${{ runner.temp }}\dc-state
        run: cargo test --workspace --locked
